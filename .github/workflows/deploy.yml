# Student capstone deploy — copy to .github/workflows/deploy.yml in your repo.
#
# Every push to main: builds your Docker image IN Azure Container Registry
# (no Docker needed in the runner, no registry password anywhere), then points
# your Container App at the new image.
#
# Setup (once, done for you at onboarding): five repo VARIABLES (not secrets —
# none of these values are secret):
#   AZURE_CLIENT_ID        — your CI identity (id-gh-<you>)
#   AZURE_TENANT_ID        — d75a3b31-b6ea-4bc1-9a3c-f760e543f24e
#   AZURE_SUBSCRIPTION_ID  — da17b3c4-4654-42b9-8719-5be9df6afa9f
#   ACR_NAME               — the shared registry name
#   STUDENT                — your roster name (also your app + hostname)
name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC token for azure/login — this is the whole auth story
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (in ACR)
        run: |
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}/web:${{ github.sha }} .

      # Store secrets as Container App secrets (from GitHub secrets — never in the repo)
      # and point env vars at them. All values come from `env:` below (not interpolated
      # into the shell) so special characters and secret masking are handled safely.
      # OAuth provider creds are OPTIONAL here: if a GitHub secret is unset, that provider
      # is simply skipped, so the app stays healthy before the OAuth apps exist. AUTH_SECRET
      # is required for sessions — set it (repo secret) or sign-in and gating will 500.
      - name: Configure secrets and deploy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
        run: |
          set -euo pipefail
          APP_ORIGIN="https://${{ vars.STUDENT }}.apps.human-angle.com"

          # Build the secret list and matching env-var refs, skipping any empty value.
          SECRET_ARGS=()
          ENV_ARGS=(AUTH_TRUST_HOST=true "AUTH_URL=${APP_ORIGIN}")
          add() { # <secret-name> <ENV_VAR_NAME> <value>
            if [ -n "$3" ]; then
              SECRET_ARGS+=("$1=$3")
              ENV_ARGS+=("$2=secretref:$1")
            else
              echo "note: $2 not set — skipping (dependent feature stays off)"
            fi
          }
          add anthropic-api-key   ANTHROPIC_API_KEY   "${ANTHROPIC_API_KEY:-}"
          add auth-secret         AUTH_SECRET         "${AUTH_SECRET:-}"
          add auth-google-id      AUTH_GOOGLE_ID      "${AUTH_GOOGLE_ID:-}"
          add auth-google-secret  AUTH_GOOGLE_SECRET  "${AUTH_GOOGLE_SECRET:-}"
          add auth-github-id      AUTH_GITHUB_ID      "${AUTH_GITHUB_ID:-}"
          add auth-github-secret  AUTH_GITHUB_SECRET  "${AUTH_GITHUB_SECRET:-}"

          if [ ${#SECRET_ARGS[@]} -gt 0 ]; then
            az containerapp secret set \
              --resource-group rg-students-platform \
              --name ca-${{ vars.STUDENT }} \
              --secrets "${SECRET_ARGS[@]}"
          fi

          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}/web:${{ github.sha }} \
            --set-env-vars "${ENV_ARGS[@]}"
